# Default values for sftd.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# The amount of SFT instances to run.  NOTE: Only one SFT can run per node due
# to `hostNetwork`. If this number is higher than the amount of nodes that can
# be used for scheduling (Also see `nodeSelector`) pods will remain in a
# pending state untill you add more capacit.
replicaCount: 1

image:
  repository: quay.io/wire/sftd
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

config:
  ingressClass: "nginx"

# The cluster's DNS domain apex. Only change this if target cluster was
# bootstrapped with a non-default domain.
clusterDomain: cluster.local

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

metrics:
  serviceMonitor:
    enabled: false

# The time to wait after terminating an sft node before shutting it down. No
# new calls will be initiated whilst a pod is being terminated.
terminationGracePeriodSeconds: 0

podAnnotations: {}

podSecurityContext:
  fsGroup: 31337

securityContext:
  # Pick a high number that is unlikely to conflict with the host
  # https://kubesec.io/basics/containers-securitycontext-runasuser/
  runAsUser: 31337
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

# The address sftd advertises to clients for media, i.e. the argument to -A.
# sftd always binds media on 0.0.0.0, so this address is advertised only and does
# not have to exist on a node interface.
#
# Accepted values:
#   __SFT_EXT_IP__   the node external IP, discovered by the get-external-ip
#                    init container. This is the default when mediaIP is unset.
#   __SFT_HOST_IP__  the node address, from status.hostIP.
#   __SFT_POD_IP__   the pod address, from status.podIP. sftd runs with
#                    hostNetwork, so this is the same address as __SFT_HOST_IP__.
#   a literal        for example 203.0.113.7.
#
# Set this to a host or literal address if clients reach sftd directly. The
# get-external-ip init container, its node-read RBAC, and its startup delay of
# up to 5 minutes are then all omitted.
#
# Leave this unset if the node is behind NAT. Clients cannot reach the node
# address in that case, so sftd must advertise the discovered external IP.
# mediaIP: __SFT_HOST_IP__

externalIpHelper:
  # This helper runs only when mediaIP references __SFT_EXT_IP__, which is the
  # default. A host or literal mediaIP removes the helper and its RBAC.
  #
  # The image used for the initContainer that determines the external IP address of the node.
  # This is a very small image that just contains kubectl, and is only used during startup.
  # We chose the `compat` flavor of the image since we need a shell to run the command that determines the external IP address, and the `compat` image includes a shell.
  image:
    repository: docker.io/alpine/kubectl
    pullPolicy: IfNotPresent
    tag: 1.35.1

# If you have multiple deployments of sftd running in one cluster, it is
# important that they run on disjoint sets of nodes, you can use nodeSelector to enforce this
nodeSelector: {}

tolerations: []

affinity: {}

# allowOrigin:  https://webapp.wire.example
# host:
tls: {}
  # {key,crt} and issuerRef are mutally exclusive
  # key:
  # crt:
  # issuerRef:
  # The name of the issuer (e.g. letsencrypr-prod)
  # name: ca-issuer
  # We can reference ClusterIssuers by changing the kind here.
  # The default value is Issuer (i.e. a locally namespaced Issuer)
  # kind: Issuer
  # This is optional since cert-manager will default to this value however
  # if you are using an external issuer, change this to that issuer group.
  # group: cert-manager.io

joinCall:
  replicaCount: 3
  # nginxinc/nginx-unprivileged expects UID 101
  securityContext:
    runAsUser: 101
  image:
    repository: docker.io/nginxinc/nginx-unprivileged
    pullPolicy: IfNotPresent
    tag: "1.29.5-alpine3.23-perl"
sftdDisco:
  image:
    repository: quay.io/wire/sftd_disco
    pullPolicy: IfNotPresent
    tag: "1.1.1" # sftd_disco is released separately from sftd, so it doesn't share the same version number

# Allow SFT instances to choose/consider using a TURN server for themselves as a proxy when
# trying to establish a connection to clients
# DOCS: https://docs.wire.com/understand/sft.html#prerequisites
turnDiscoveryEnabled: false

# Additionally advertise the pod's internal IP as an ICE candidate, alongside the
# external IP. Needed when the SFT is reachable on both an internal and an external
# address: a TURN server in front of it must be given permission for both.
# This does not open another listener; sftd always binds media on 0.0.0.0.
# Has no effect unless an external IP is available (see externalIP settings).
advertiseInternalIp: false

# Allow establishing calls involving remote SFT servers (e.g. for Federation)
# Requires appVersion 3.1.10 or later
# sftd must be directly configured with the authentication secret used by
# the TURN server and the URI for the TURN server.
# You can specify either a single turnServerURI (all replicas use the same)
# or a list of turnServerURIs (each replica gets a different one, with round-robin).
multiSFT:
  enabled: false
  secret:
  # Single URI (all replicas use this):
  # turnServerURI: "turn:turn.example.com:3478"
  # Or multiple URIs (replicas distributed across these):
  # turnServerURIs:
  #   - "turn:turn1.example.com:3478"
  #   - "turn:turn2.example.com:3478"
  #   - "turn:turn3.example.com:3478"
  turnServerURI:
  turnServerURIs: []

# This is the secret used for authentication when the multiSFT feature is disabled
# Do not use this when multiSFT is enabled, and instead use the `multiSFT.secret` field
sftTokenSecret: # "my_secret_string"

coredumps:
  enabled: false
  # storageClassName: my-storage-class
  storageSize: 10Gi

# Arguments to be appended to sftd's command line arguments. This is a plain
# string. Use it for development; established arguments should get their own
# fields/options.
additionalCmdArgs: ""


# Set to false when migrating to Gateway API (gateway.enabled: true) and the
# nginx Ingress is no longer needed.
ingress:
  enabled: true

# Gateway API ingress (Envoy Gateway). Can run alongside the nginx Ingress
# during migration; disable ingress.enabled in a follow-up apply once verified.
gateway:
  enabled: false
  # When true, a Gateway resource is created by this chart.
  # Set to false when attaching a ListenerSet to an existing Gateway.
  # Its allowedListeners must permit this namespace.
  create: true
  # Name of the Gateway resource. Defaults to <fullname>-gateway when empty.
  name: ""
  # GatewayClass name. Required when create: true.
  className: ""
  # Namespace of the Gateway. Defaults to release namespace when empty.
  # Only set this when referencing an existing Gateway in another namespace.
  namespace: ""
  listeners:
    https:
      port: 443
    # Required Gateway-owned listener; denies all routes on a separate port.
    placeholder:
      port: 65535
  annotations: {}
  infrastructure:
    annotations: {}
    labels: {}
  envoyProxy:
    create: true
    # Empty uses the Gateway name; with create: false, references an existing proxy.
    name: ""
    # Free-form EnvoyProxy spec overrides these defaults.
    spec: {}
    replicas: 2
    # Advisory spread; set [] to disable. PDB minAvailable: 1 unless replicas is 1.
    topologySpreadKeys:
      - kubernetes.io/hostname
      - topology.kubernetes.io/zone
  manageServiceType: true
  serviceType: LoadBalancer
  zoneAwareRouting:
    enabled: false
    minEndpointsThreshold: 3
  proxyProtocol:
    enabled: false
    optional: false
  tls:
    enabled: true
    minVersion: "1.3"
    maxVersion: "1.3"
    ecdhCurves: ["X25519MLKEM768", "X25519", "P-256", "P-384", "P-521"]
    # TLS <= 1.2 only; omitted when minVersion is 1.3.
    ciphers:
      - ECDHE-ECDSA-AES128-GCM-SHA256
      - ECDHE-ECDSA-AES256-GCM-SHA384
      - ECDHE-RSA-AES128-GCM-SHA256
      - ECDHE-RSA-AES256-GCM-SHA384
    signatureAlgorithms: []
  alpn:
    enabled: true
    protocols: [h2, http/1.1]
  patchPolicies:
    enabled: true
    # Required explicitly for FIPS mode; must match the controller runtime flag.
    # Envoy Gateway < 1.10 defaults to false, >= 1.10 to true.
    xdsNameSchemeV2: null
    # Legacy scheme: override if another listener is first on the HTTPS port.
    xdsListenerName: ""
    targetGatewayClass: false

# Overrides gateway.tls with Envoy's FIPS_202205 compliance profile.
# Requires EnvoyPatchPolicy support and a dedicated, non-merged Gateway.
# Use an ECDSA P-256/P-384 certificate (cert-manager above uses P-384).
FIPS_202205_tls_profile: false
