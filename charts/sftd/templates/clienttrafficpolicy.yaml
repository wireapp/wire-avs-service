{{- if and .Values.gateway.enabled .Values.gateway.clientTrafficPolicy.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "sftd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftd.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ include "sftd.gatewayName" . }}
  alpnProtocols:
    {{- toYaml .Values.gateway.clientTrafficPolicy.alpnProtocols | nindent 4 }}
{{- end }}
