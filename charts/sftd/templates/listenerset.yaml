{{- if .Values.gateway.enabled }}
{{- if and .Values.gateway.create (and .Values.gateway.namespace (ne .Values.gateway.namespace .Release.Namespace)) }}
{{- fail "gateway.namespace must match the release namespace when gateway.create is true" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: {{ include "sftd.fullname" . | quote }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftd.labels" . | nindent 4 }}
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "sftd.gatewayName" . | quote }}
    namespace: {{ .Values.gateway.namespace | default .Release.Namespace | quote }}
  listeners:
    - name: https
      port: {{ .Values.gateway.listeners.https.port }}
      protocol: HTTPS
      hostname: {{ required "host must be set" .Values.host | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ include "sftd.fullname" . | quote }}
            kind: Secret
{{- end }}
