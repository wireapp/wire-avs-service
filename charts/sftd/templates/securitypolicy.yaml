{{- if .Values.gateway.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: {{ include "sftd.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftd.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ include "sftd.fullname" . }}
  cors:
    allowOrigins:
    {{- $origins := split "," (required "Must specify allowOrigin" .Values.allowOrigin) }}
    {{- range $origins }}
      - {{ trim . | quote }}
    {{- end }}
    allowMethods:
      - GET
      - POST
      - OPTIONS
      - DELETE
      - PUT
      - PATCH
    allowHeaders:
      - Content-Type
      - Authorization
    exposeHeaders:
      - Content-Type
    maxAge: 24h
{{- end }}
