{{- if .Values.gateway.enabled }}
{{- if not (kindIs "bool" .Values.FIPS_202205_tls_profile) }}
{{- fail "FIPS_202205_tls_profile must be a boolean" }}
{{- end }}
{{- if .Values.FIPS_202205_tls_profile }}
{{- if or .Values.gateway.patchPolicies.targetGatewayClass .Values.gateway.envoyProxy.spec.mergeGateways }}
{{- fail "FIPS_202205_tls_profile requires a dedicated Gateway: disable mergeGateways and targetGatewayClass" }}
{{- end }}
{{/* The patch policy must live in the Gateway's namespace. On a Gateway owned
     by another release (e.g. wire-ingress), enable the profile there instead:
     its patch covers this chart's listener too. */}}
{{- if ne (include "sftd.gatewayNamespace" .) .Release.Namespace }}
{{- fail "FIPS_202205_tls_profile cannot patch a Gateway in another namespace; enable the profile on the Gateway's owner, e.g. wire-ingress, whose patch covers this listener" }}
{{- end }}
{{/* If the patch matches nothing, this chart's ClientTrafficPolicy keeps the
     listener on the restrictive TLS 1.2-only baseline. */}}
{{- if or (not .Values.gateway.tls.enabled) (not .Values.gateway.patchPolicies.enabled) }}
{{- fail "FIPS_202205_tls_profile requires gateway.tls.enabled and gateway.patchPolicies.enabled" }}
{{- end }}
{{/* A wrong xDS name leaves the patch unapplied and the TLS 1.2 baseline active. */}}
{{- if not (kindIs "bool" .Values.gateway.patchPolicies.xdsNameSchemeV2) }}
{{- fail "gateway.patchPolicies.xdsNameSchemeV2 must be set explicitly to match the controller runtime flag in FIPS mode (default: false before Envoy Gateway 1.10, true from 1.10)" }}
{{- end }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: {{ include "sftd.gatewayName" . }}-bsi
  namespace: {{ .Release.Namespace }}
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: {{ include "sftd.gatewayName" . | quote }}
  type: JSONPatch
  jsonPatches:
    - type: type.googleapis.com/envoy.config.listener.v3.Listener
      {{- if .Values.gateway.patchPolicies.xdsNameSchemeV2 }}
      name: {{ printf "tcp-%v" .Values.gateway.listeners.https.port | quote }}
      {{- else if .Values.gateway.patchPolicies.xdsListenerName }}
      name: {{ .Values.gateway.patchPolicies.xdsListenerName | quote }}
      {{- else }}
      {{/* Legacy names use the first listener on the HTTPS port. */}}
      name: {{ printf "%s/%s/%s/%s/https" .Release.Namespace (include "sftd.gatewayName" .) .Release.Namespace (include "sftd.fullname" .) | quote }}
      {{- end }}
      operation:
        op: add
        # Every TLS filter chain on this socket. Replaces tls_params whole, so
        # chains without a ClientTrafficPolicy are covered too; FIPS_202205
        # overrides their versions, ciphers, groups and signature algorithms.
        jsonPath: "$.filter_chains[*].transport_socket.typed_config.common_tls_context"
        path: tls_params
        value:
          compliance_policies: [FIPS_202205]
{{- end }}
{{- end }}
