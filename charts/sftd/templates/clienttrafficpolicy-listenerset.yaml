{{- if .Values.gateway.enabled }}
{{- $alpn := .Values.gateway.alpn.enabled -}}
{{- $tls := .Values.gateway.tls.enabled -}}
{{- $proxyProtocol := .Values.gateway.proxyProtocol.enabled -}}
{{- if or $alpn $tls $proxyProtocol }}
{{/* One policy per target: separate ALPN/TLS/PROXY policies would conflict. */}}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: {{ include "sftd.fullname" . }}-client-traffic
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftd.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "sftd.fullname" . | quote }}
  {{- if $proxyProtocol }}
  proxyProtocol:
    optional: {{ .Values.gateway.proxyProtocol.optional }}
  {{- end }}
  {{- if or $alpn $tls }}
  tls:
    {{- include "sftd.downstreamTls" . | trim | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
