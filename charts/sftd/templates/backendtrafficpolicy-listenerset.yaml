{{- if and .Values.gateway.enabled .Values.gateway.zoneAwareRouting.enabled }}
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ include "sftd.fullname" . }}-zone-aware
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sftd.labels" . | nindent 4 }}
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: {{ include "sftd.fullname" . | quote }}
  loadBalancer:
    type: LeastRequest
    zoneAware:
      preferLocal:
        minEndpointsThreshold: {{ .Values.gateway.zoneAwareRouting.minEndpointsThreshold }}
{{- end }}
