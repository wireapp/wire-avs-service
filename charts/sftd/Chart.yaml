apiVersion: v2
name: sftd
description: SFTD is a component for engaging in conference calls
type: application

# This is the chart version. This version number should be incremented each time you make changes
# to the chart and its templates, including the app version.
# Versions are expected to follow Semantic Versioning (https://semver.org/)
version: 0.0.42

# This is the version number of the application being deployed. This version number should be
# incremented each time you make changes to the application. Versions are not expected to
# follow Semantic Versioning. They should reflect the version the application is using.
appVersion: 0.0.42
annotations:
  # must conform to https://github.com/helm/community/blob/main/hips/hip-0015.md
  # The sftd tag below is a placeholder, rewritten to the published appVersion
  # when the chart is packaged (see the sed in the Jenkinsfile). Do not write a
  # real tag here, and do not repeat the placeholder string in a comment.
  # The substitution is a global sed.
  helm.sh/images: |
    - name: sftd
      image: quay.io/wire/sftd:do-not-use
    - name: get-external-ip
      image: docker.io/alpine/kubectl:1.35.1
    - name: sftd-disco
      image: quay.io/wire/sftd_disco:1.1.1
    - name: join-call-nginx
      image: docker.io/nginxinc/nginx-unprivileged:1.29.5-alpine3.23-perl
