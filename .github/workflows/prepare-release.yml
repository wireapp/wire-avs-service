name: Prepare release

run-name: Prepare ${{ inputs.type }} from ${{ inputs.source_branch }} (by @${{ github.actor }})

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: 'Branch to release from: dev, or a maintained release/X.Y line'
        type: string
        default: dev
        required: true
      type:
        description: 'Release channel'
        type: choice
        options: [ga, alpha, beta, rc]
        default: ga
        required: true
      bump:
        description: 'Applies when the latest release is a GA: the next GA, or the first pre-release of the next line'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      force:
        description: 'Bypass the CI status gate on the source commit (logged loudly)'
        type: boolean
        default: false
        required: false

permissions: {}

concurrency:
  group: prepare-release-${{ inputs.source_branch }}-${{ inputs.type }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      checks: read
      statuses: read
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate inputs
        id: inputs
        uses: wireapp/wire-rm-actions/release-inputs@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          source-branch: ${{ inputs.source_branch }}
          type: ${{ inputs.type }}
          version-bump: ${{ inputs.bump }}
          force: ${{ inputs.force }}

      - name: Verify source branch exists
        uses: wireapp/wire-rm-actions/release-source@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: verify
          source-branch: ${{ inputs.source_branch }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve source commit
        id: source
        uses: wireapp/wire-rm-actions/release-source@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: resolve
          source-branch: ${{ inputs.source_branch }}

      - name: Compute target version
        id: version
        uses: wireapp/wire-rm-actions/version@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: release
          source-branch: ${{ inputs.source_branch }}
          release-type: ${{ steps.inputs.outputs.release-type }}
          version-bump: ${{ inputs.bump }}

      - name: Summarise the candidate
        uses: wireapp/wire-rm-actions/release-source@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: summary
          source-branch: ${{ inputs.source_branch }}
          version: ${{ steps.version.outputs.version }}
          release-type: ${{ steps.inputs.outputs.release-type }}
          source-sha: ${{ steps.source.outputs.sha }}
          base-tag: ${{ steps.version.outputs.base-tag }}
          from-tag: ${{ steps.version.outputs.from-tag }}
          note: Building and testing the candidate image, then the Helm chart. The draft release link appears here once created.

      - name: Require the release files
        env:
          TARGET: ${{ steps.version.outputs.version }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
        run: |
          set -euo pipefail
          for f in publication/release-note.md publication/declaration.json publication/compatibility.yaml; do
            if [[ ! -s "$f" ]]; then
              echo "error: no $f for ${TARGET} on ${SOURCE_BRANCH} (ADR-0020 §2): a pre-release needs the three release files, like a GA." >&2
              exit 1
            fi
          done

      - name: Resolve release documents
        id: documents
        uses: wireapp/wire-rm-actions/release-documents@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          component: sftd
          version: ${{ steps.version.outputs.version }}
          release-type: ${{ inputs.type }}
          out-dir: /tmp/release-documents

      - name: Check the compatibility file
        uses: wireapp/wire-rm-actions/compatibility@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          file: publication/compatibility.yaml

      - name: Copy the compatibility file
        id: compatibility_copy
        run: |
          set -euo pipefail
          cp publication/compatibility.yaml /tmp/release-documents/compatibility.yaml
          sha256=$(sha256sum /tmp/release-documents/compatibility.yaml | awk '{print $1}')
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: CI gate
        uses: wireapp/wire-rm-actions/ci-gate@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          version: ${{ steps.version.outputs.version }}
          source-commit: ${{ steps.source.outputs.sha }}
          force: ${{ steps.inputs.outputs.force }}
          checks-from: all

      - name: Generate release notes
        id: changelog
        uses: wireapp/wire-rm-actions/changelog@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          from-tag: ${{ steps.version.outputs.from-tag }}
          to-ref: ${{ steps.source.outputs.sha }}
          version: ${{ steps.version.outputs.version }}
          heading: false

      - name: Collect the release inputs
        env:
          DOCS: /tmp/release-documents
          CHANGELOG_FILE: ${{ steps.changelog.outputs.file }}
          NOTE_FILE: ${{ steps.documents.outputs.note-file }}
          NOTE_PATH: ${{ steps.documents.outputs.note-path }}
          DOCUMENTS_JSON: ${{ steps.documents.outputs.documents-json }}
          COMPATIBILITY_SHA256: ${{ steps.compatibility_copy.outputs.sha256 }}
          FROM_TAG: ${{ steps.version.outputs.from-tag }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release-inputs"
          mkdir -p "$out"
          cp "$DOCS"/release-note.md "$DOCS"/release-declaration.json "$DOCS"/compatibility.yaml "$out/"
          cp "$CHANGELOG_FILE" "$out/changelog.md"
          documents_json=$(jq -c --arg sha "$COMPATIBILITY_SHA256" \
            '. + {compatibility: {file: "compatibility.yaml", sha256: $sha}}' <<<"$DOCUMENTS_JSON")
          jq -n \
            --arg note_file "$NOTE_FILE" --arg note_path "$NOTE_PATH" --arg from_tag "$FROM_TAG" \
            --arg documents_json "$documents_json" \
            '$ARGS.named' > "$out/values.json"

      - name: Upload the release inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-inputs
          path: ${{ runner.temp }}/release-inputs
          retention-days: 1

  candidate:
    name: Build the release candidate
    needs: prepare
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    permissions:
      contents: write
      id-token: write
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          submodules: true
          persist-credentials: false

      - name: Fetch the submodules of wire-avs
        run: git -C contrib/avs submodule update --init --depth 1

      - name: Download the release inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-inputs
          path: /tmp/release-inputs

      - name: Read the release inputs
        id: values
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key)=\(.value)"' /tmp/release-inputs/values.json >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image locally
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: docker buildx build --load --file docker/Dockerfile --build-arg SFT_VERSION="$VERSION" --tag sftd:candidate .

      - name: Test the image
        env:
          IMAGE: sftd:candidate
          VERSION: ${{ needs.prepare.outputs.version }}
        run: .github/scripts/test-image.sh

      - name: Login to quay.io with the OIDC token of the job
        id: quay
        uses: wireapp/wire-rm-actions/quay-login@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          robot: wire+gha_wire-avs-service

      - name: Push the candidate image
        id: image
        uses: wireapp/wire-rm-actions/build-image@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          dockerfile: docker/Dockerfile
          image: quay.io/wire/sftd
          version: ${{ needs.prepare.outputs.version }}
          tag: ${{ needs.prepare.outputs.version }}-candidate-${{ github.run_id }}
          revision: ${{ needs.prepare.outputs.sha }}
          build-args: |
            SFT_VERSION=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=sftd
            org.opencontainers.image.description=Wire's SFT server for conference calls

      - name: Package the binary of the candidate image
        id: tarball
        env:
          IMAGE: quay.io/wire/sftd@${{ steps.image.outputs.digest }}
          VERSION: ${{ needs.prepare.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/binary
        run: |
          set -euo pipefail
          mkdir -p "$OUT_DIR"
          container=$(docker create "$IMAGE")
          docker cp "${container}:/usr/local/bin/sftd" "$OUT_DIR/wire-sftd"
          docker rm "$container" >/dev/null
          name="wire-sft-${VERSION}-linux-amd64"
          tar -C "$OUT_DIR" -czf "$OUT_DIR/${name}.tar.gz" wire-sftd
          (cd "$OUT_DIR" && sha256sum "${name}.tar.gz" | awk '{print $1}' > "${name}.sha256")
          {
            echo "file=$OUT_DIR/${name}.tar.gz"
            echo "sha256_file=$OUT_DIR/${name}.sha256"
          } >> "$GITHUB_OUTPUT"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0

      - name: Package the candidate chart
        id: package
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          OUT_DIR: ${{ runner.temp }}/chart
        run: .github/scripts/package-chart.sh

      - name: Chart checksum
        id: helm
        env:
          CHART_FILE: ${{ steps.package.outputs.file }}
        run: |
          set -euo pipefail
          sha256=$(sha256sum "$CHART_FILE" | awk '{print $1}')
          {
            echo "package_file=$(basename "$CHART_FILE")"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Write the release manifest
        id: manifest
        uses: wireapp/wire-rm-actions/release-manifest@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: write
          manifest: ${{ runner.temp }}/release-manifest.json
          component: sftd
          version: ${{ needs.prepare.outputs.version }}
          release-type: ${{ inputs.type }}
          source-repository: ${{ github.server_url }}/${{ github.repository }}
          source-ref: ${{ inputs.source_branch }}
          source-commit: ${{ needs.prepare.outputs.sha }}
          image-repository: quay.io/wire/sftd
          image-digest: ${{ steps.image.outputs.digest }}
          image-candidate-tag: ${{ steps.image.outputs.tag }}
          chart-repository: oci://quay.io/wire/charts/${{ inputs.type == 'ga' && 'stable' || 'dev' }}/sftd
          chart-file: ${{ steps.helm.outputs.package_file }}
          chart-sha256: ${{ steps.helm.outputs.sha256 }}
          compatibility-file: /tmp/release-inputs/compatibility.yaml
          documents-json: ${{ steps.values.outputs.documents_json }}

      - name: Compose the release body
        id: body
        env:
          RELEASE_TYPE: ${{ inputs.type }}
          TARGET: ${{ needs.prepare.outputs.version }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.sha }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          HELM_SHA256: ${{ steps.helm.outputs.sha256 }}
          REPOSITORY: ${{ github.repository }}
          SERVER_URL: ${{ github.server_url }}
          FROM_TAG: ${{ steps.values.outputs.from_tag }}
          NOTES_DOC: /tmp/release-inputs/${{ steps.values.outputs.note_file }}
          NOTES_PATH: ${{ steps.values.outputs.note_path }}
          CHANGELOG_FILE: /tmp/release-inputs/changelog.md
        run: |
          set -euo pipefail
          base_version="${TARGET%%-*}"
          notes_url=""
          if [[ -n "$NOTES_PATH" ]]; then
            notes_url="${SERVER_URL}/${REPOSITORY}/blob/${SOURCE_COMMIT}/${NOTES_PATH}"
          fi
          chart_channel=dev
          if [[ "$RELEASE_TYPE" == "ga" ]]; then chart_channel=stable; fi
          body_file="${RUNNER_TEMP}/release-body.md"
          {
            if [[ "$RELEASE_TYPE" == "ga" ]]; then
              cat "$NOTES_DOC"
            else
              echo "> [!IMPORTANT]"
              echo "> **This is a pre-release (\`${RELEASE_TYPE}\`).** It is a candidate for \`${base_version}\`, not a shipped release: deploy it to non-production environments only."
              if [[ -n "$notes_url" ]]; then
                echo ">"
                echo "> Release notes for ${base_version}: [\`${NOTES_PATH}\`](${notes_url})"
              fi
            fi
            echo
            echo "---"
            echo
            if grep -q '[^[:space:]]' "$CHANGELOG_FILE"; then
              cat "$CHANGELOG_FILE"
            else
              echo "_No user-facing changes since \`${FROM_TAG}\`._"
            fi
            echo
            echo "---"
            echo
            echo "### Artifacts"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Docker image | \`quay.io/wire/sftd:${TARGET}\` |"
            echo "| Helm chart | \`sftd\` \`${TARGET}\` |"
            echo "| Chart repositories | \`charts-avs\` (S3) · \`oci://quay.io/wire/charts/${chart_channel}\` |"
            echo "| Binary | \`wire-sft-${TARGET}-linux-amd64.tar.gz\` |"
            echo
            echo "<details>"
            echo "<summary>Checksums and provenance</summary>"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| Source commit | \`${SOURCE_COMMIT}\` |"
            echo "| Image digest | \`${IMAGE_DIGEST}\` |"
            echo "| Chart SHA256 | \`${HELM_SHA256}\` |"
            echo
            echo "\`release-manifest.json\` attached to this release is the authoritative record."
            echo
            echo "</details>"
          } > "$body_file"
          echo "file=$body_file" >> "$GITHUB_OUTPUT"

      - name: Check for existing release (pre-draft)
        uses: wireapp/wire-rm-actions/ci-gate@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          version: ${{ needs.prepare.outputs.version }}
          checks-gate: false

      - name: Create the draft release
        id: release
        uses: wireapp/wire-rm-actions/draft-release@813f008b900b1ad3284502f97cac343d80b1836b # v0.1.0
        with:
          mode: create
          version: ${{ needs.prepare.outputs.version }}
          target: ${{ needs.prepare.outputs.sha }}
          title: v${{ needs.prepare.outputs.version }}
          body-file: ${{ steps.body.outputs.file }}
          assets: |
            ${{ steps.package.outputs.file }}
            ${{ steps.tarball.outputs.file }}
            ${{ steps.tarball.outputs.sha256_file }}
            ${{ steps.manifest.outputs.manifest }}
            /tmp/release-inputs/release-note.md
            /tmp/release-inputs/release-declaration.json
            /tmp/release-inputs/compatibility.yaml

      - name: Summarise the candidate
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          HELM_SHA256: ${{ steps.helm.outputs.sha256 }}
        run: |
          set -euo pipefail
          {
            echo
            echo "| Artifact | Identity |"
            echo "| --- | --- |"
            echo "| Image candidate (\`quay.io/wire/sftd:${IMAGE_TAG}\`) | \`${IMAGE_DIGEST}\` |"
            echo "| Helm package | \`${HELM_SHA256}\` |"
            echo
            echo "Install the attached chart with the candidate image in a validation environment, then approve the \`release-publication\` environment on this run. Publication promotes these exact artifacts, it never rebuilds them."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs:
      - prepare
      - candidate
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.prepare.outputs.version }}
      release_id: ${{ needs.candidate.outputs.release_id }}
    secrets:
      CHARTS_AVS_AWS_ACCESS_KEY_ID: ${{ secrets.CHARTS_AVS_AWS_ACCESS_KEY_ID }}
      CHARTS_AVS_AWS_SECRET_ACCESS_KEY: ${{ secrets.CHARTS_AVS_AWS_SECRET_ACCESS_KEY }}
      WIRE_BUILDS_WRITE_ACCESS_GH_TOKEN: ${{ secrets.WIRE_BUILDS_WRITE_ACCESS_GH_TOKEN }}
